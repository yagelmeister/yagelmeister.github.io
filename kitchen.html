<!doctype html>
<html>
<head>
  <script>
    (function(){
      var lang = localStorage.getItem("yagel_lang") || "en";
      document.documentElement.setAttribute("data-lang", lang);
      document.documentElement.lang = lang;
    })();
  </script>
  <meta charset="utf-8" />

<body>
  <div class="wrap">
    <header>

    <main class="masonry" aria-label="DE KLOOF">

        </div>

    <footer>
      <a class="pill" href="cheffie.html" data-i18n="pill_cheffie">CHEF YAKKI</a>
      <a class="pill" href="home.html" data-i18n="pill_home">HOME</a>
      <a class="pill" href="contact.html" data-i18n="pill_contact">CONTACT</a>
    </footer>
  </div>

  <script>
    (function(){
      var savedTheme = localStorage.getItem("theme");
      document.documentElement.setAttribute("data-theme", savedTheme || "auto");
    })();

    var SETS = [
      {
        title: { nl: "BAKKERIJ MATER", en: "BAKERY MATER" },
        desc:  { nl: "elke vrijdag houdt ik me bezig met het mengen, kneden, vouwen en vormen van zuurdesem deeg", en: "every friday, i'm occupied with mixing, kneading, folding and shaping sourdough" },
        photos: [
          "images/koken/keuken/mater/mater_nye.webp",
          "images/koken/keuken/mater/baguettes.webp",
          "images/koken/keuken/mater/pitas.webp",
          "images/koken/keuken/mater/boederij.webp",
          "images/koken/keuken/mater/mater_vuurwerk.webp",
          "images/koken/keuken/mater/bubbeldeeg.webp",
        ],
        tilt:  "tilt-3"
      },
      {
        title: { nl: "TESTTAFEL", en: "TESTTAFEL" },
        desc:  { nl: "in 2025 stond ik wekelijks in de keuken van dit fine dining restaurant", en: "in 2025, i worked weekly in the kitchen of this fine dining restaurant" },
        photos: [
          "images/koken/keuken/testtafel/tt1.webp",
          "images/koken/keuken/testtafel/tt8.webp",
          "images/koken/keuken/testtafel/tt2.webp",
          "images/koken/keuken/testtafel/tt3.webp",
          "images/koken/keuken/testtafel/tt4.webp",
          "images/koken/keuken/testtafel/tt5.webp",
          "images/koken/keuken/testtafel/tt6.webp",
          "images/koken/keuken/testtafel/tt7.webp",
        ],
        tilt:  "tilt-2"

      },
      {
        title: { nl: "DE SERING", en: "DE SERING" },
        desc:  { nl: "in 2024 heb ik wekelijks voor deze volkskeuken gekookt", en: "in 2024, i cooked weekly for this community kitchen" },
        photos: [
          "images/koken/keuken/sering/sering1.webp",
          "images/koken/keuken/sering/sering2.webp",
          "images/koken/keuken/sering/tt8.mp4",
          "images/koken/keuken/sering/sering3.webp",
          "images/koken/keuken/sering/sering4.webp",
          "images/koken/keuken/sering/sering5.webp",
          "images/koken/keuken/sering/sering6.webp",
          "images/koken/keuken/sering/sering7.webp",
        ],
        tilt:  "tilt-2"

      },
      {
        title: { nl: "MARUKIN RAMEN", en: "MARUKIN RAMEN" },
        desc:  { nl: "voor een paar maanden, heb ik in tokyo gyoza's en ramen deeg leren maken. af en toe ging kas mee", en: "for a few months, i learned how to make gyoza's and ramen dough in tokyo. sometimes, kas joined me" },
        photos: [
          "images/koken/keuken/japan ramen/ramen0.webp",
          "images/koken/keuken/japan ramen/ramen00.webp",
          "images/koken/keuken/japan ramen/ramen1.webp",
          "images/koken/keuken/japan ramen/ramen2.webp",
          "images/koken/keuken/japan ramen/ramen3.webp",
          "images/koken/keuken/japan ramen/ramen4.webp",
          "images/koken/keuken/japan ramen/ramen5.webp",
          "images/koken/keuken/japan ramen/ramen6.webp",
        ],
        tilt:  "tilt-3"
      }
    ];

    function escapeHtml(str){
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    var SLIDER_LABELS = {
      nl: { prev: "vorige", next: "volgende" },
      en: { prev: "prev", next: "next" }
    };

    function renderSets(lang){
      var colA = document.getElementById('col-a');
      if(!colA) return;
      var colB = document.getElementById('col-b');
      if(!colB) return;

      if(window.matchMedia("(max-width: 760px)").matches){
        colB.innerHTML = "";
      }

      SETS.forEach(function(s, idx){
        var card = document.createElement("div");
        card.className = "card player " + (s.tilt || "") + " " + (s.size || "");
        card.setAttribute("data-set-card", "1");

        var title = (s.title && (s.title[lang] || s.title.nl)) || "Set";
        var desc  = s.desc ? (s.desc[lang] || s.desc.nl || "") : "";
        var photos = Array.isArray(s.photos) ? s.photos : [];
        var sliderId = "slider-" + idx;

        var labels = SLIDER_LABELS[lang] || SLIDER_LABELS.en;

        var photos = Array.isArray(s.photos) ? s.photos : [];
        var first = photos[0];
        var last  = photos[photos.length - 1];

        var loopPhotos;
        if(photos.length > 1){
          loopPhotos = [last].concat(photos).concat([first]); // clone-last + echte fotos + clone-first
        }else{
          loopPhotos = photos.slice();
        }

        var hasArrows = photos.length > 1;

        card.innerHTML =
          '<div>' +
            '<div class="label">' + escapeHtml(title) + '</div>' +
            '<div class="meta">photos</div>' +
            (desc ? '<div class="desc">' + escapeHtml(desc) + '</div>' : '') +

            '<div class="slider" data-slider-id="' + sliderId + '">' +
              '<div class="slider-frame" aria-label="photo slider">' +

                '<div class="slider-track">' +
                  loopPhotos.map(function(p){
                    var isVideo = p.toLowerCase().endsWith(".mp4");
                    if(isVideo){
                      return (
                        '<video class="slide-video" ' +
                        'muted autoplay loop playsinline preload="metadata">' +
                          '<source src="' + escapeHtml(p) + '" type="video/mp4">' +
                        '</video>'
                      );
                    }else{
                      return '<img loading="eager" decoding="async" src="' + escapeHtml(p) + '" alt="">';
                    }
                  }).join("") +
                '</div>' +

                (hasArrows
                  ? '<div class="slider-overlay" aria-hidden="true">' +
                      '<div class="slider-hover left"></div>' +
                      '<div class="slider-hover right"></div>' +
                    '</div>'
                  : ''
                ) +

              '</div>' +
            '</div>' +

          '</div>';
          
        var isMobile = window.matchMedia("(max-width: 760px)").matches;

        if(isMobile){
          colA.appendChild(card);     // alles onder elkaar in col-a
        }else{
          ((colA.offsetHeight <= colB.offsetHeight) ? colA : colB).appendChild(card);
        }
      });

      wireSliders();
      autoAspectRatio();
      kickVideos();
    }

    function kickVideos(){
        document.querySelectorAll(".slider-track video").forEach(function(v){
          // Safari-proof: properties zetten (niet alleen attributes)
          v.muted = true;
          v.defaultMuted = true;
          v.playsInline = true;
          v.autoplay = true;
          v.loop = true;

          // probeer te starten
          var p = v.play();
          if(p && typeof p.catch === "function"){
            p.catch(function(){
              // browser blokkeert nog steeds: geen drama
              // (meestal gebeurt dit als muted niet "echt" pakt of video heeft rare audio track)
            });
          }
        });
      }

    function autoAspectRatio(){
      document.querySelectorAll(".slider-frame").forEach(function(frame){
        var media = Array.from(frame.querySelectorAll("img, video"));
        if(!media.length) return;

        var waits = media.map(function(el){
          return new Promise(function(resolve){
            if(el.tagName === "IMG"){
              if(el.complete && el.naturalWidth) return resolve();
              el.addEventListener("load", resolve, { once:true });
              el.addEventListener("error", resolve, { once:true });
            }else{
              // VIDEO
              if(el.readyState >= 1 && el.videoWidth) return resolve(); // metadata loaded
              el.addEventListener("loadedmetadata", resolve, { once:true });
              el.addEventListener("error", resolve, { once:true });
            }
          });
        });

        Promise.all(waits).then(function(){
          var maxRatio = 0;

          media.forEach(function(el){
            var w, h;
            if(el.tagName === "IMG"){
              w = el.naturalWidth || 0;
              h = el.naturalHeight || 1;
            }else{
              w = el.videoWidth || 0;
              h = el.videoHeight || 1;
            }
            var r = w / h;
            if(r > maxRatio) maxRatio = r;
          });

          if(!maxRatio || !isFinite(maxRatio)) maxRatio = 16/9;
          frame.style.aspectRatio = String(maxRatio);
        });
      });
    }

    function wireSliders(){
      var SPEED_AUTO = 60;       // px per soconde
      var SPEED_USER = 180;      // px per soconde
      var AUTO_DELAY = 700;      // ms wachten na in-beeld komen / mouseleave
      var VIEW_THRESHOLD = 1.0;  // hoeveel van de slider in beeld moet zijn

      var io = ("IntersectionObserver" in window) ? new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          var frame = entry.target;
          var api = frame.__sliderApi;
          if(!api) return;

          api.inView = entry.isIntersecting && entry.intersectionRatio >= VIEW_THRESHOLD;

          if(!api.inView){
            api.stopAll();
          }else{
            api.maybeScheduleAuto();
          }
        });
      }, { threshold: [1] }) : null;

      document.querySelectorAll(".slider").forEach(function(slider){
        var frame = slider.querySelector(".slider-frame");
        var track = slider.querySelector(".slider-track");
        if(!frame || !track) return;

        var slides = Array.from(track.querySelectorAll("img, video"));
        if(slides.length < 2) return;

        var leftZone  = slider.querySelector(".slider-hover.left");
        var rightZone = slider.querySelector(".slider-hover.right");
        if(!leftZone || !rightZone) return;

        var dir = 0;
        var raf = null;
        var lastT = 0;

        var offset = 0;     // px
        var slideW = 0;     // px
        var realCount = 0;  // echte fotos (zonder clones)

        var hovering = false;
        var inView = false;

        var autoTimer = null;
        var autoDir = 1; // standaard auto naar rechts

        var api = { isAuto: false };

        function apply(){
          track.style.transform = "translateX(" + (-offset) + "px)";
        }

        function recalc(){
          slideW = frame.clientWidth;
          realCount = slides.length >= 3 ? (slides.length - 2) : slides.length;

          // startpositie: echte eerste (index 1) als we clones hebben
          if(slides.length >= 3 && offset === 0){
            offset = slideW;
          }
          apply();
        }

        function stopRAF(){
          if(raf){
            cancelAnimationFrame(raf);
            raf = null;
          }
          lastT = 0;
        }

        function tick(t){
          if(!lastT) lastT = t;
          var dt = (t - lastT) / 1000;
          lastT = t;

          if(dir !== 0){
            var speed = api.isAuto ? SPEED_AUTO : SPEED_USER;
            offset += dir * speed * dt;

            if(slides.length >= 3){
              var min = 0;
              var max = (realCount + 1) * slideW;

              if(offset >= max){
                offset = slideW;              // terug naar echte eerste
              }else if(offset <= min){
                offset = realCount * slideW;  // naar echte laatste
              }
            }else{
              var max2 = (slides.length - 1) * slideW;
              if(offset >= max2) offset = 0;
              if(offset < 0) offset = max2;
            }

            apply();
          }

          raf = requestAnimationFrame(tick);
        }

        function startRAF(newDir, isAuto){
          api.isAuto = !!isAuto;   // true = auto, false = user
          dir = newDir;
          if(raf) return;
          lastT = 0;
          raf = requestAnimationFrame(tick);
        }

        function stopMove(){
          dir = 0;
          stopRAF();
        }

        function clearAutoTimer(){
          if(autoTimer){
            clearTimeout(autoTimer);
            autoTimer = null;
          }
        }

        function stopAll(){
          clearAutoTimer();
          stopMove();
        }

        function maybeScheduleAuto(){
          clearAutoTimer();
          if(!inView) return;
          if(hovering) return;

          autoTimer = setTimeout(function(){
            if(!inView) return;
            if(hovering) return;
            startRAF(autoDir, true);
          }, AUTO_DELAY);
        }

        function setHover(state){
          hovering = state;
          if(hovering){
            stopAll();
          }else{
            maybeScheduleAuto();
          }
        }

        function snap(oneDir){
          stopAll();
          recalc();

          // 🔑 eerst exact uitlijnen op huidige slide
          var idx = Math.round(offset / slideW);
          idx += oneDir;

          if(slides.length >= 3){
            // rekening houden met clones
            if(idx >= realCount + 1) idx = 1;
            if(idx <= 0) idx = realCount;
          }else{
            var maxIdx = slides.length - 1;
            if(idx > maxIdx) idx = 0;
            if(idx < 0) idx = maxIdx;
          }

          offset = idx * slideW;
          apply();
          maybeScheduleAuto();
        }


        // init
        recalc();

        // resize: behoud ongeveer dezelfde "index"
        window.addEventListener("resize", function(){
          var oldW = slideW || frame.clientWidth;
          var idx = oldW ? (offset / oldW) : 0;
          recalc();
          offset = idx * slideW;
          apply();
        });

        // Hover gedrag
        frame.addEventListener("mouseenter", function(){ setHover(true); });
        frame.addEventListener("mouseleave", function(){
          setHover(false);
          stopMove();
        });

        // User control via zones (hover)
        leftZone.addEventListener("mouseenter", function(){
          setHover(true);
          startRAF(-1, false);
        });
        rightZone.addEventListener("mouseenter", function(){
          setHover(true);
          startRAF(1, false);
        });

        leftZone.addEventListener("mouseleave", function(){
          stopMove();
          setHover(false);
        });
        rightZone.addEventListener("mouseleave", function(){
          stopMove();
          setHover(false);
        });

        // Click = snap 1 slide
        leftZone.addEventListener("click", function(e){
          e.preventDefault();
          snap(-1);
        });
        rightZone.addEventListener("click", function(e){
          e.preventDefault();
          snap(1);
        });

        // “API” voor IntersectionObserver
        frame.__sliderApi = {
          get inView(){ return inView; },
          set inView(v){ inView = !!v; },
          stopAll: stopAll,
          maybeScheduleAuto: maybeScheduleAuto
        };

        if(io){
          io.observe(frame);
        }else{
          inView = true;
          maybeScheduleAuto();
        }
      });
    }

    (function(){
      var dict = {
        nl: {
          name: "YA'GEL SCHOONDERBEEK",
          intro_label: "KEUKEN ERVARINGEN",
          intro_meta: "op allerlei plekken heb ik van alles geleerd als chef\n\nop dit moment vooral de wegen van zuurdesem bij bakkerij mater",
          pill_home: "HOME",
          pill_cheffie: "CHEF YAKKI",
          pill_contact: "CONTACT"
        },
        en: {
          name: "YA'GEL SCHOONDERBEEK",
          intro_label: "KITCHEN EXPERIENCES",
          intro_meta: "at different places I have learned different things as a chef\n\nat the moment i'm learning the ways of sourdough at bakery mater every friday",
          pill_home: "HOME",
          pill_cheffie: "CHEF YAKKI",
          pill_contact: "CONTACT"
        }
      };

      function applyLang(lang){
        var pack = dict[lang] || dict.nl;

        // DOM state (for CSS hooks)
        document.documentElement.lang = lang;
        document.documentElement.setAttribute("data-lang", lang);

        // Text replacements
        document.querySelectorAll("[data-i18n]").forEach(function(el){
          var key = el.getAttribute("data-i18n");
          if(pack[key]) el.textContent = pack[key];
        });

        // Toggle button state
        document.querySelectorAll(".lang-btn").forEach(function(btn){
          btn.setAttribute(
            "aria-pressed",
            btn.getAttribute("data-lang") === lang ? "true" : "false"
          );
        });

        // Persistence across pages
        localStorage.setItem("yagel_lang", lang);

        // remove previously rendered set cards
        document.querySelectorAll('[data-set-card="1"]').forEach(el => el.remove());

        // then render in the chosen lang
        renderSets(lang);
      }

      var initial = localStorage.getItem("yagel_lang") || document.documentElement.lang || "en";
      if(!dict[initial]) initial = "en";

      applyLang(initial);

      document.querySelectorAll(".lang-btn").forEach(function(btn){
        btn.addEventListener("click", function(){
          applyLang(btn.getAttribute("data-lang"));
        });
      });
    })();
  </script>
