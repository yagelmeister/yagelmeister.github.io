<!doctype html>
<html>
<head>
  <script>
    (function(){
      var lang = localStorage.getItem("yagel_lang") || "en";
      document.documentElement.setAttribute("data-lang", lang);
      document.documentElement.lang = lang;
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>yagel.nl - studio</title>
  <meta name="description" content="studio" />

  <link rel="stylesheet" href="styling.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="wrap">
    <header>
      <div class="topbar" aria-label="Taal kiezen">
        <button class="lang-btn" type="button" data-lang="nl" aria-pressed="true">nl</button>
        <button class="lang-btn" type="button" data-lang="en" aria-pressed="false">en</button>
      </div>

      <div class="name">
        <a href="home.html" data-i18n="name">YA'GEL SCHOONDERBEEK</a>
      </div>
      <div class="rule"></div>
    </header>

    <main class="masonry" aria-label="studio">
      <div id="col-a" class="masonry-col">
        <!-- put the intro tile here -->
        <div class="card intro tilt-1">
          <div class="label" data-i18n="studio_label">STUDIO</div>
          <div class="meta" data-i18n="studio_meta">in an anti-squat garage, we build a music studio for rehearsals and recordings</div>
        </div>
      </div>
      <div id="col-b" class="masonry-col"></div>
    </main>

    <footer>
      <a class="pill" href="music.html" data-i18n="pill_music">MUZIEK</a>
      <a class="pill" href="home.html" data-i18n="pill_home">HOME</a>
      <a class="pill" href="contact.html" data-i18n="pill_contact">CONTACT</a>
    </footer>
  </div>

  <script>
    var IS_SAFARI = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

    (function(){
      var savedTheme = localStorage.getItem("theme");
      document.documentElement.setAttribute("data-theme", savedTheme || "auto");
    })();

    var SETS = [
      {
        title: { nl: "GEAR", en: "GEAR" },
        desc:  { nl: "snapshots van spullen in de stuuu", en: "snapshots of stuff in the stuuu" },
        photos: [
          "images/muziek/muziekstudio/mixer.webp",
          "images/muziek/muziekstudio/congas.webp",
          "images/muziek/muziekstudio/piano.webp",
          "images/muziek/muziekstudio/speaker.webp",
        ],
        size:  "span-3 row-2",
        tilt:  "tilt-6"
      },
      {
        title: { nl: "OPENING", en: "OPENING" },
        desc:  { nl: "poster voor de studio opening", en: "poster for the studio opening" },
        photos: [
          "images/muziek/muziekstudio/opening.webp",
        ],
        size:  "span-3 row-2",
        tilt:  "tilt-6"
      },
    ];

    function escapeHtml(str){
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    var SLIDER_LABELS = {
      nl: { prev: "vorige", next: "volgende" },
      en: { prev: "prev", next: "next" }
    };

    function renderSets(lang){
      var colA = document.getElementById('col-a');
      if(!colA) return;
      var colB = document.getElementById('col-b');
      if(!colB) return;

      if(window.matchMedia("(max-width: 760px)").matches){
        colB.innerHTML = "";
      }


      SETS.forEach(function(s, idx){
        var card = document.createElement("div");
        card.setAttribute("data-set-card", "1");
        card.className = "card player " + (s.tilt || "") + " " + (s.size || "");
        

        var title = (s.title && (s.title[lang] || s.title.nl)) || "Set";
        var desc  = s.desc ? (s.desc[lang] || s.desc.nl || "") : "";
        var photos = Array.isArray(s.photos) ? s.photos : [];
        var sliderId = "slider-" + idx;

        var labels = SLIDER_LABELS[lang] || SLIDER_LABELS.en;

        var photos = Array.isArray(s.photos) ? s.photos : [];
        var first = photos[0];
        var last  = photos[photos.length - 1];

        var loopPhotos;
        if(photos.length > 1){
          loopPhotos = [last].concat(photos).concat([first]); // clone-last + echte fotos + clone-first
        }else{
          loopPhotos = photos.slice();
        }

        var hasArrows = photos.length > 1;

        card.innerHTML =
          '<div>' +
            '<div class="label">' + escapeHtml(title) + '</div>' +
            '<div class="meta">photos</div>' +
            (desc ? '<div class="desc">' + escapeHtml(desc) + '</div>' : '') +

            '<div class="slider" data-slider-id="' + sliderId + '">' +
              '<div class="slider-frame" aria-label="photo slider">' +

                '<div class="slider-track">' +
                  loopPhotos.map(function(p, mediaIndex){
                    var isVideo = p.toLowerCase().endsWith(".mp4");
                    var isPrimarySlide = photos.length > 1 ? mediaIndex === 1 : mediaIndex === 0;
                    var shouldPrioritize = idx < 2 && isPrimarySlide;
                    if(isVideo){
                      return (
                        '<video class="slide-video" ' +
                        'muted loop playsinline preload="' + (shouldPrioritize ? 'metadata' : 'none') + '">' +
                          '<source src="' + escapeHtml(p) + '" type="video/mp4">' +
                        '</video>'
                      );
                    }else{
                      return '<img loading="' + (shouldPrioritize ? 'eager' : 'lazy') + '" fetchpriority="' + (shouldPrioritize ? 'high' : 'low') + '" decoding="async" src="' + escapeHtml(p) + '" alt="">';
                    }
                  }).join("") +
                '</div>' +

                (hasArrows
                  ? '<div class="slider-overlay" aria-hidden="true">' +
                      '<div class="slider-hover left"></div>' +
                      '<div class="slider-hover right"></div>' +
                    '</div>'
                  : ''
                ) +

              '</div>' +
            '</div>' +

          '</div>';
        
        var isMobile = window.matchMedia("(max-width: 760px)").matches;

        if(isMobile){
          colA.appendChild(card);     // alles onder elkaar in col-a
        }else{
          ((colA.offsetHeight <= colB.offsetHeight) ? colA : colB).appendChild(card);
        }
      });

      wireSliders();
      autoAspectRatio();
      kickVideos();
    }
  
    function kickVideos(){
      document.querySelectorAll(".slider-frame").forEach(function(frame){
        var api = frame.__sliderApi;
        if(api && typeof api.syncMedia === "function"){
          api.syncMedia(true);
        }
      });
    }

    function autoAspectRatio(){
      document.querySelectorAll(".slider-frame").forEach(function(frame){
        var media = Array.from(frame.querySelectorAll("img, video"));
        if(!media.length) return;
        var primary = media.length >= 3 ? media[1] : media[0];
        frame.style.aspectRatio = String(16/9);

        function applyAspect(el){
          var w, h;
          if(el.tagName === "IMG"){
            w = el.naturalWidth || 0;
            h = el.naturalHeight || 0;
          }else{
            w = el.videoWidth || 0;
            h = el.videoHeight || 0;
          }
          if(!w || !h) return false;
          frame.style.aspectRatio = String(w / h);
          return true;
        }

        if(applyAspect(primary)) return;

        if(primary.tagName === "IMG"){
          primary.addEventListener("load", function(){
            applyAspect(primary);
          }, { once:true });
          return;
        }

        if(primary.readyState >= 1 && primary.videoWidth){
          applyAspect(primary);
          return;
        }

        primary.addEventListener("loadedmetadata", function(){
          applyAspect(primary);
        }, { once:true });
      });
    }

   function wireSliders(){
      var SPEED_AUTO = 60;       // px per soconde
      var SPEED_USER = 180;      // px per soconde
      var AUTO_DELAY = 700;      // ms wachten na in-beeld komen / mouseleave
      var VIEW_THRESHOLD = 1.0;  // hoeveel van de slider in beeld moet zijn

      var io = ("IntersectionObserver" in window) ? new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          var frame = entry.target;
          var api = frame.__sliderApi;
          if(!api) return;

          api.inView = entry.isIntersecting && entry.intersectionRatio >= VIEW_THRESHOLD;

          if(!api.inView){
            api.stopAll();
            api.pauseMedia();
          }else{
            api.syncMedia(true);
            api.maybeScheduleAuto();
          }
        });
      }, { threshold: [1] }) : null;

      document.querySelectorAll(".slider").forEach(function(slider){
        var frame = slider.querySelector(".slider-frame");
        var track = slider.querySelector(".slider-track");
        if(!frame || !track) return;

        var slides = Array.from(track.querySelectorAll("img, video"));
        if(slides.length < 2) return;

        var leftZone  = slider.querySelector(".slider-hover.left");
        var rightZone = slider.querySelector(".slider-hover.right");
        if(!leftZone || !rightZone) return;

        var dir = 0;
        var raf = null;
        var lastT = 0;

        var offset = 0;     // px
        var slideW = 0;     // px
        var realCount = 0;  // echte fotos (zonder clones)

        var hovering = false;
        var inView = false;

        var autoTimer = null;
        var autoDir = 1; // standaard auto naar rechts

        var api = { isAuto: false };
        var lastActiveIndex = -1;

        function apply(){
          track.style.transform = "translateX(" + (-offset) + "px)";
          syncMedia(false);
        }

        function configureVideo(v, mode){
          v.muted = true;
          v.defaultMuted = true;
          v.playsInline = true;
          v.loop = true;
          v.autoplay = (mode === "play");

          if(mode === "play" || mode === "warm"){
            if(v.preload !== "auto") v.preload = "auto";
            if(v.readyState === 0){
              try{
                v.load();
              }catch(_err){}
            }
          }else if(v.preload !== "metadata"){
            v.preload = "metadata";
          }

          if(mode === "play"){
            var p = v.play();
            if(p && typeof p.catch === "function"){
              p.catch(function(){});
            }
            return;
          }

          v.pause();
        }

        function pauseAllMedia(){
          slides.forEach(function(el){
            if(el.tagName === "VIDEO"){
              configureVideo(el, "idle");
            }
          });
        }

        function syncMedia(force){
          if(!slideW || !slides.length) return;
          var activeIndex = Math.round(offset / slideW);
          if(!force && activeIndex === lastActiveIndex) return;
          lastActiveIndex = activeIndex;

          slides.forEach(function(el, mediaIndex){
            if(el.tagName !== "VIDEO") return;
            var distance = Math.abs(mediaIndex - activeIndex);
            if(distance === 0){
              configureVideo(el, "play");
              return;
            }
            if(distance === 1){
              configureVideo(el, "warm");
              return;
            }
            configureVideo(el, "idle");
          });
        }

        function recalc(){
          slideW = frame.clientWidth;
          realCount = slides.length >= 3 ? (slides.length - 2) : slides.length;

          // startpositie: echte eerste (index 1) als we clones hebben
          if(slides.length >= 3 && offset === 0){
            offset = slideW;
          }
          apply();
        }

        function stopRAF(){
          if(raf){
            cancelAnimationFrame(raf);
            raf = null;
          }
          lastT = 0;
        }

        function tick(t){
          if(!lastT) lastT = t;
          var dt = (t - lastT) / 1000;
          lastT = t;

          if(dir !== 0){
            var speed = api.isAuto ? SPEED_AUTO : SPEED_USER;
            offset += dir * speed * dt;

            if(slides.length >= 3){
              var min = 0;
              var max = (realCount + 1) * slideW;

              if(offset >= max){
                offset = slideW;              // terug naar echte eerste
              }else if(offset <= min){
                offset = realCount * slideW;  // naar echte laatste
              }
            }else{
              var max2 = (slides.length - 1) * slideW;
              if(offset >= max2) offset = 0;
              if(offset < 0) offset = max2;
            }

            apply();
          }

          raf = requestAnimationFrame(tick);
        }

        function startRAF(newDir, isAuto){
          api.isAuto = !!isAuto;   // true = auto, false = user
          dir = newDir;
          if(raf) return;
          lastT = 0;
          raf = requestAnimationFrame(tick);
        }

        function stopMove(){
          dir = 0;
          stopRAF();
        }

        function clearAutoTimer(){
          if(autoTimer){
            clearTimeout(autoTimer);
            autoTimer = null;
          }
        }

        function stopAll(){
          clearAutoTimer();
          stopMove();
        }

        function maybeScheduleAuto(){
          clearAutoTimer();
          if(!inView) return;
          if(hovering) return;

          autoTimer = setTimeout(function(){
            if(!inView) return;
            if(hovering) return;
            startRAF(autoDir, true);
          }, AUTO_DELAY);
        }

        function setHover(state){
          hovering = state;
          if(hovering){
            stopAll();
          }else{
            maybeScheduleAuto();
          }
        }

        function snap(oneDir){
          stopAll();
          recalc();

          // 🔑 eerst exact uitlijnen op huidige slide
          var idx = Math.round(offset / slideW);
          idx += oneDir;

          if(slides.length >= 3){
            // rekening houden met clones
            if(idx >= realCount + 1) idx = 1;
            if(idx <= 0) idx = realCount;
          }else{
            var maxIdx = slides.length - 1;
            if(idx > maxIdx) idx = 0;
            if(idx < 0) idx = maxIdx;
          }

          offset = idx * slideW;
          apply();
          maybeScheduleAuto();
        }


        // init
        recalc();

        // resize: behoud ongeveer dezelfde "index"
        window.addEventListener("resize", function(){
          var oldW = slideW || frame.clientWidth;
          var idx = oldW ? (offset / oldW) : 0;
          recalc();
          offset = idx * slideW;
          apply();
        });

        // Hover gedrag
        frame.addEventListener("mouseenter", function(){ setHover(true); });
        frame.addEventListener("mouseleave", function(){
          setHover(false);
          stopMove();
        });

        // User control via zones (hover)
        leftZone.addEventListener("mouseenter", function(){
          setHover(true);
          startRAF(-1, false);
        });
        rightZone.addEventListener("mouseenter", function(){
          setHover(true);
          startRAF(1, false);
        });

        leftZone.addEventListener("mouseleave", function(){
          stopMove();
          setHover(false);
        });
        rightZone.addEventListener("mouseleave", function(){
          stopMove();
          setHover(false);
        });

        // Click = snap 1 slide
        leftZone.addEventListener("click", function(e){
          e.preventDefault();
          snap(-1);
        });
        rightZone.addEventListener("click", function(e){
          e.preventDefault();
          snap(1);
        });

        // “API” voor IntersectionObserver
        frame.__sliderApi = {
          get inView(){ return inView; },
          set inView(v){ inView = !!v; },
          stopAll: stopAll,
          pauseMedia: pauseAllMedia,
          syncMedia: syncMedia,
          maybeScheduleAuto: maybeScheduleAuto
        };

        if(io){
          io.observe(frame);
        }else{
          inView = true;
          syncMedia(true);
          maybeScheduleAuto();
        }
      });
    }

    (function(){
      var dict = {
        nl: {
          name: "YA'GEL SCHOONDERBEEK",
          studio_label: "STUDIO",
          studio_meta: "in een anti-kraak garage, hebben we een muziekstudio gebouwd for repetities en opnames \n\n binnenkort meer info en fotos over dit project",
          pill_home: "HOME",
          pill_music: "MUZIEK",
          pill_contact: "CONTACT"
        },
        en: {
          name: "YA'GEL SCHOONDERBEEK",
          studio_label: "STUDIO",
          studio_meta: "in an anti-squat garage, we build a music studio for rehearsals and recordings \n\n soon more info and photos on this project",
          pill_home: "HOME",
          pill_music: "MUSIC",
          pill_contact: "CONTACT"
        }
      };

      function applyLang(lang){
        var pack = dict[lang] || dict.nl;

        // DOM state (for CSS hooks)
        document.documentElement.lang = lang;
        document.documentElement.setAttribute("data-lang", lang);

        // Text replacements
        document.querySelectorAll("[data-i18n]").forEach(function(el){
          var key = el.getAttribute("data-i18n");
          if(pack[key]) el.textContent = pack[key];
        });

        // Toggle button state
        document.querySelectorAll(".lang-btn").forEach(function(btn){
          btn.setAttribute(
            "aria-pressed",
            btn.getAttribute("data-lang") === lang ? "true" : "false"
          );
        });

        // Persistence across pages
        localStorage.setItem("yagel_lang", lang);

        // remove previously rendered set cards
        document.querySelectorAll('[data-set-card="1"]').forEach(el => el.remove());

        // then render in the chosen lang
        renderSets(lang);
      }

      var initial = localStorage.getItem("yagel_lang") || document.documentElement.lang || "en";
      if(!dict[initial]) initial = "en";

      applyLang(initial);

      document.querySelectorAll(".lang-btn").forEach(function(btn){
        btn.addEventListener("click", function(){
          applyLang(btn.getAttribute("data-lang"));
        });
      });
    })();
  </script>

</body>
</html>
